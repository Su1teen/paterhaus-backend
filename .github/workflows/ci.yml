name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paterhaus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paterhaus_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paterhaus_test
      WEBHOOK_SECRET: ci_webhook_secret_placeholder
      INTERNAL_DASHBOARD_SECRET: ci_dashboard_secret_placeholder
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
